name: codeatlas-production

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codeatlas
      POSTGRES_DB: codeatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated password in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U codeatlas -d codeatlas"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks: [backend]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    image: codeatlas-api:production
    environment:
      APP_ENV: production
      API_KEY: ${API_KEY:?Set a generated private API key in .env.production}
      DATABASE_URL: postgresql+psycopg://codeatlas:${POSTGRES_PASSWORD:?}@postgres:5432/codeatlas
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set a generated webhook secret in .env.production}
      BENCHMARK_CACHE_BYPASS_ENABLED: "false"
      ELASTICSEARCH_CLOSE_SEARCH_CONNECTIONS: "false"
      EMBEDDING_DEVICE: cpu
      HF_HOME: /app/.cache/huggingface
    volumes:
      - repositories:/app/data/repos
      - model_cache:/app/.cache/huggingface
    networks: [backend, edge]
    depends_on:
      postgres: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      CODEATLAS_DOMAIN: ${CODEATLAS_DOMAIN:?Set your public hostname in .env.production}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

networks:
  backend: {internal: true}
  edge: {}

volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:
  repositories:
  model_cache:
  caddy_data:
  caddy_config:
